name: Release Build

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build Backend (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd src-app/backend
          uv venv
          if [ -f "uv.lock" ]; then uv sync; else uv pip install -r requirements.txt; fi
          bash build_backend.sh

      - name: Build Backend (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd src-app/backend
          uv venv
          if (Test-Path "uv.lock") { uv sync } else { uv pip install -r requirements.txt }
          .\build_backend.ps1

      - name: Install Frontend Dependencies
        run: |
          cd src-app/frontend
          bun install

      - name: Build Frontend & Inject Backend (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd src-app/frontend
          bunx electrobun build
          # The exact artifact path depends on ElectroBun output, usually in build/
          # For macOS, it's build/dev-macos-arm64/ERTH Assistant-dev.app (we will copy the backend inside)
          if [ -d "build/dev-macos-arm64/ERTH Assistant-dev.app" ]; then
            cp -r ../backend/dist/robyn_engine "build/dev-macos-arm64/ERTH Assistant-dev.app/Contents/MacOS/"
          fi
          # For Linux
          if [ -d "build/dev-linux-x64/ERTH Assistant-dev" ]; then
            cp -r ../backend/dist/robyn_engine "build/dev-linux-x64/ERTH Assistant-dev/"
          fi

      - name: Build Frontend & Inject Backend (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd src-app/frontend
          bunx electrobun build
          if (Test-Path "build\dev-windows-x64\ERTH Assistant-dev") {
            Copy-Item -Path "..\backend\dist\robyn_engine" -Destination "build\dev-windows-x64\ERTH Assistant-dev" -Recurse
          }

      - name: Zip Release Artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd src-app/frontend/build
          zip -r ERTH_Assistant_${{ matrix.os }}.zip ./*

      - name: Zip Release Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd src-app/frontend/build
          Compress-Archive -Path * -DestinationPath ERTH_Assistant_windows.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-app/frontend/build/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
