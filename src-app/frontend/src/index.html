<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERTH Assistant</title>
    <!-- 引入 HTMX 灵魂脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.10"></script>
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-sidebar: #121620;
            --bg-card: #1b212f;
            --border-color: #242c3d;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-stack);
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 统一中枢控制台布局 - 左侧固定 Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.05em;
        }

        .brand::before {
            content: "⚡";
            font-size: 1.2rem;
        }

        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Tab 导航锚点样式 */
        .tab-btn {
            background: none;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 12px 16px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background-color: var(--border-color);
            border-color: rgba(59, 130, 246, 0.2);
            transform: translateX(4px);
        }

        .tab-btn.active, .tab-btn:focus {
            color: var(--text-primary);
            background-color: rgba(59, 130, 246, 0.15);
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.1);
        }

        /* 右侧核心超媒体主渲染区 */
        .main-viewport {
            flex: 1;
            padding: 40px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.05), transparent 60%);
        }

        /* 欢迎卡片 */
        .welcome-card {
            max-width: 500px;
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            background: var(--bg-card);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .welcome-card:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.15);
        }

        .welcome-card h1 {
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .welcome-card p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin: 12px 0;
        }

        .pulse-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 12px;
            border-radius: 100px;
            margin-top: 16px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.9);
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            70% {
                transform: scale(1.1);
                opacity: 0.5;
                box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
            }
            100% {
                transform: scale(0.9);
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }
    </style>
</head>
<body>

    <!-- 左侧固定 Tab 导航栏 -->
    <aside class="sidebar">
        <div class="brand">ERTH Console</div>
        <nav class="nav-group">
            <!-- Tab 1 (待办中心): 绑定 hx-get 并指定目标渲染区 -->
            <button class="tab-btn active"
                    hx-get="/api/v1/todos"
                    hx-target="#control-panel-viewport"
                    hx-trigger="click">
                <span>📅</span> 待办中心
            </button>
            
            <!-- Tab 2 (全景日志): 绑定 hx-get 并指定目标渲染区 -->
            <button class="tab-btn"
                    hx-get="/api/v1/notebook"
                    hx-target="#control-panel-viewport"
                    hx-trigger="click">
                <span>📓</span> 全景日志
            </button>
        </nav>
    </aside>

    <!-- 右侧核心超媒体主渲染区 -->
    <main id="control-panel-viewport" class="main-viewport">
        <!-- 默认欢迎首屏内容 -->
        <div class="welcome-card">
            <h1>ERTH Assistant 3.0</h1>
            <p>双核引擎已初始化，Local-First 基盘筑底就位。</p>
            <p>等待看门狗拉起并绑定 Robyn 端口中...</p>
            <div class="pulse-indicator">
                <span class="pulse-dot"></span>
                <span>基盘就绪</span>
            </div>
        </div>
    </main>

</body>
</html>
